  <script>
    tailwind.config = {

            primary:   { DEFAULT:'var(--color-primary)',   light:'var(--color-primary-light)',   dark:'var(--color-primary-dark)' },
            secondary: { DEFAULT:'var(--color-secondary)', light:'var(--color-secondary-light)', dark:'var(--color-secondary-dark)' },
            accent:    { DEFAULT:'var(--color-accent)',    light:'var(--color-accent-light)',    dark:'var(--color-accent-dark)' },
            surface:   { DEFAULT:'var(--color-surface)',   alt:'var(--color-surface-alt)' },
            border:    { DEFAULT:'var(--color-border)' },
            muted:     { DEFAULT:'var(--color-muted)' },
          },
        }
      }
    };

  <style>
    /* ============================================================
       DESIGN TOKENS — change here to rebrand an entire site
       ============================================================ */
    :root {
      /* Brand colours */
      --color-primary:         #6366f1;
      --color-primary-light:   #818cf8;
      --color-primary-dark:    #4f46e5;
      --color-secondary:       #06b6d4;
      --color-secondary-light: #67e8f9;
      --color-secondary-dark:  #0891b2;
      --color-accent:          #f59e0b;
      --color-accent-light:    #fcd34d;
      --color-accent-dark:     #d97706;

      /* Surfaces */
      --color-bg:              #0f172a;
      --color-surface:         #1e293b;
      --color-surface-alt:     #334155;
      --color-border:          #334155;

      /* Text */
      --color-text:            #f1f5f9;
      --color-muted:           #94a3b8;

      /* Status */
      --color-success:         #22c55e;
      --color-warning:         #f59e0b;
      --color-error:           #ef4444;

      /* Radius */
      --radius-sm:   6px;
      --radius-md:   10px;
      --radius-lg:   16px;
      --radius-xl:   24px;
      --radius-full: 9999px;

      /* Shadows */
      --shadow-sm:  0 1px 3px rgba(0,0,0,.4);
      --shadow-md:  0 4px 16px rgba(0,0,0,.4);
      --shadow-lg:  0 8px 32px rgba(0,0,0,.5);
      --shadow-glow:0 0 40px rgba(99,102,241,.25);
    }

    /* Base */
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: 'Inter', sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    h1,h2,h3,h4,h5,h6 { font-family: 'Space Grotesk', sans-serif; line-height: 1.25; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--color-surface); }
    ::-webkit-scrollbar-thumb { background: var(--color-surface-alt); border-radius: 3px; }

    /* Glow helper */
    .glow { box-shadow: var(--shadow-glow); }
    .glow-text { text-shadow: 0 0 30px rgba(99,102,241,.5); }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, var(--color-primary-light), var(--color-secondary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Glassmorphism card */
    .glass {
      background: rgba(30,41,59,.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.07);
    }

    /* Animated gradient border */
    .border-gradient {
      position: relative;
      border: 1px solid transparent;
      background-clip: padding-box;
    }
    .border-gradient::before {
      content:'';
      position:absolute;
      inset:-1px;
      border-radius: inherit;
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      z-index:-1;
    }

    /* Page transitions */
    .page-enter { animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* Skeleton */
    .skeleton {
      background: linear-gradient(90deg, var(--color-surface) 25%, var(--color-surface-alt) 50%, var(--color-surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-sm);
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* Safe area for mobile bottom nav */
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0); }

    /* Video card aspect ratio */
    .aspect-video-card { aspect-ratio: 9/16; }
    .aspect-16-9 { aspect-ratio: 16/9; }

    /* Hidden helper */
    .page-section { display: none; }
    .page-section.active { display: block; }

    /* Toast */
    #toast-container { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); z-index:9999; pointer-events:none; }

    /* Modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); backdrop-filter:blur(4px); z-index:1000; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .modal-box { background: var(--color-surface); border-radius: var(--radius-lg); border:1px solid var(--color-border); max-width:600px; width:100%; max-height:90vh; overflow-y:auto; }

    /* Admin sidebar */
    .admin-sidebar { background: var(--color-surface); border-right:1px solid var(--color-border); }

    /* Announcement bar */
    .announcement-bar { background: linear-gradient(90deg, var(--color-primary-dark), var(--color-secondary-dark)); }

    /* Hero */
    .hero-bg {
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99,102,241,.25) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(6,182,212,.15) 0%, transparent 50%),
        var(--color-bg);
    }

    /* Section divider */
    .section-divider { border-color: var(--color-border); }

    /* Card hover */
    .card-hover { transition: transform .2s ease, box-shadow .2s ease; cursor: pointer; }
    .card-hover:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }

    /* Nav active */
    .nav-active { color: var(--color-primary-light) !important; }
    .nav-active-bg { background: rgba(99,102,241,.15) !important; border-color: rgba(99,102,241,.3) !important; }

    /* Bottom nav */
    .bottom-nav-item { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.65rem; font-weight:500; color: var(--color-muted); transition: color .2s; flex:1; padding:.6rem 0; }
    .bottom-nav-item.active { color: var(--color-primary-light); }
    .bottom-nav-item i { font-size:1.2rem; }

    /* Search */
    .search-input { background:var(--color-surface); border:1px solid var(--color-border); color:var(--color-text); border-radius:var(--radius-full); padding:.65rem 1.25rem .65rem 3rem; width:100%; outline:none; transition:border-color .2s; }
    .search-input:focus { border-color: var(--color-primary); }

    /* Badge */
    .badge { display:inline-flex; align-items:center; padding:.2rem .65rem; border-radius:var(--radius-full); font-size:.72rem; font-weight:600; letter-spacing:.03em; }
    .badge-primary { background:rgba(99,102,241,.2); color: var(--color-primary-light); }
    .badge-secondary { background:rgba(6,182,212,.2); color: var(--color-secondary-light); }
    .badge-accent { background:rgba(245,158,11,.2); color: var(--color-accent-light); }
    .badge-success { background:rgba(34,197,94,.2); color:#4ade80; }
    .badge-muted { background:var(--color-surface-alt); color:var(--color-muted); }

    /* Button base */
    .btn { display:inline-flex; align-items:center; gap:.5rem; padding:.65rem 1.5rem; border-radius:var(--radius-md); font-weight:600; font-size:.9rem; transition: all .2s; cursor:pointer; border:none; text-decoration:none; white-space:nowrap; }
    .btn-primary { background: var(--color-primary); color:#fff; }
    .btn-primary:hover { background: var(--color-primary-dark); transform:translateY(-1px); box-shadow: var(--shadow-glow); }
    .btn-secondary { background: var(--color-surface-alt); color: var(--color-text); border:1px solid var(--color-border); }
    .btn-secondary:hover { background: var(--color-surface); border-color:var(--color-primary); }
    .btn-outline { background:transparent; color: var(--color-primary-light); border:1px solid var(--color-primary); }
    .btn-outline:hover { background: rgba(99,102,241,.1); }
    .btn-ghost { background:transparent; color:var(--color-muted); border:none; padding:.5rem .75rem; }
    .btn-ghost:hover { color: var(--color-text); background: var(--color-surface-alt); }
    .btn-sm { padding:.4rem 1rem; font-size:.8rem; }
    .btn-lg { padding:.85rem 2rem; font-size:1rem; }

    /* Forms */
    .form-input, .form-select, .form-textarea {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      border-radius: var(--radius-md);
      padding: .6rem 1rem;
      width:100%;
      outline:none;
      transition:border-color .2s;
      font-family:inherit;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,.15);
    }
    .form-textarea { resize:vertical; min-height:120px; }
    label.form-label { display:block; font-size:.85rem; font-weight:600; margin-bottom:.35rem; color:var(--color-muted); }

    /* Stats counter animation */
    .stat-value { font-family:'Space Grotesk',sans-serif; font-size:2.5rem; font-weight:800; }

    /* TOC */
    .toc-link { color: var(--color-muted); text-decoration:none; font-size:.85rem; transition:color .2s; display:block; padding:.2rem 0; }
    .toc-link:hover, .toc-link.active { color: var(--color-primary-light); }

    /* Pagination */
    .page-btn { width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:var(--radius-md); border:1px solid var(--color-border); background:var(--color-surface); color:var(--color-muted); cursor:pointer; transition: all .2s; font-size:.85rem; }
    .page-btn:hover, .page-btn.active { background:var(--color-primary); border-color:var(--color-primary); color:#fff; }

    /* Code block */
    pre { background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-md); padding:1rem; overflow-x:auto; font-size:.83rem; line-height:1.6; }
    code { font-family:'Fira Code','Consolas',monospace; color: var(--color-secondary-light); }

    /* Article body */
    .article-body h2 { font-size:1.5rem; font-weight:700; margin:2rem 0 .75rem; color:var(--color-text); }
    .article-body h3 { font-size:1.2rem; font-weight:600; margin:1.5rem 0 .5rem; color:var(--color-text); }
    .article-body p  { margin-bottom:1.1rem; color:#cbd5e1; }
    .article-body ul,
    .article-body ol { margin-bottom:1.1rem; padding-left:1.5rem; color:#cbd5e1; }
    .article-body li { margin-bottom:.4rem; }
    .article-body blockquote { border-left:3px solid var(--color-primary); padding-left:1rem; margin:1.5rem 0; color:var(--color-muted); font-style:italic; }

    /* Reels vertical */
    .reel-container { scroll-snap-type:y mandatory; overflow-y:scroll; height:calc(100vh - 120px); }
    .reel-item { scroll-snap-align:start; height:calc(100vh - 120px); position:relative; }

    /* Admin table */
    .admin-table { width:100%; border-collapse:collapse; }
    .admin-table th { text-align:left; padding:.75rem 1rem; font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--color-muted); border-bottom:1px solid var(--color-border); }
    .admin-table td { padding:.75rem 1rem; font-size:.875rem; border-bottom:1px solid rgba(51,65,85,.5); }
    .admin-table tr:hover td { background:rgba(255,255,255,.02); }

    /* Progress bar */
    .progress-bar { height:6px; border-radius:var(--radius-full); background:var(--color-surface-alt); overflow:hidden; }
    .progress-fill { height:100%; border-radius:var(--radius-full); background: linear-gradient(90deg, var(--color-primary), var(--color-secondary)); transition:width .8s ease; }

    /* Breadcrumb */
    .breadcrumb-item + .breadcrumb-item::before { content:'›'; margin:0 .5rem; color:var(--color-muted); }

    /* FAQ */
    .faq-item { border:1px solid var(--color-border); border-radius:var(--radius-md); overflow:hidden; }
    .faq-answer { display:none; }
    .faq-answer.open { display:block; }

    /* Footer */
    .footer { background: var(--color-surface); border-top:1px solid var(--color-border); }

    /* Announcement bar close */
    #announcement-bar { display:flex; }

    /* Mobile menu */
    #mobile-menu { display:none; position:fixed; inset:0; z-index:500; background:var(--color-bg); overflow-y:auto; }
    #mobile-menu.open { display:flex; flex-direction:column; }

    /* Responsive table wrapper */
    .table-wrapper { overflow-x:auto; }

    @media (max-width:768px) {
      .stat-value { font-size:1.8rem; }
    }
  </style>

  <!-- ============================================================
       JSON-LD — Organization (base, overridden per page)
       ============================================================ -->
  <script type="application/ld+json" id="jsonld-org">
  {
    "@context":"https://schema.org",
    "@type":"Organization",
    "name":"GlobalWebsiteMaster",
    "url":"https://www.yoursite.com",
    "logo":"https://www.yoursite.com/logo.png",
    "sameAs":[]
  }
  </script>
  <script type="application/ld+json" id="jsonld-website">

    "@context":"https://schema.org",

      "target":"https://www.yoursite.com/search?q={search_term_string}",
      "query-input":"required name=search_term_string"
    }
  }
  </script>
</head>

  '/contact':      renderContact,
  '/privacy':      renderPrivacy,
  '/terms':        renderTerms,
  '/sitemap':      renderSitemapPage,
  '/search':       renderSearch,
  '/404':          render404,
  // Dynamic routes handled in routeMatch()
};

function routeMatch(path) {
  if (ROUTES[path]) return ROUTES[path];
  if (path.startsWith('/blog/'))    return () => renderArticle(path.replace('/blog/', ''));
  if (path.startsWith('/explore/')) return () => renderItemDetail(path.replace('/explore/', ''));
  if (path.startsWith('/videos/'))  return () => renderVideoDetail(path.replace('/videos/', ''));
  if (path.startsWith('/category/'))return () => renderCategoryHub(path.replace('/category/', ''));
  if (path.startsWith('/hub/'))     return () => renderSeoHub(path.replace('/hub/', ''));
  if (path.startsWith('/admin'))    return () => renderAdmin(path);
  return render404;
}

function navigate(route, pushState=true) {
  currentRoute = route;
  if (pushState) {
    history.pushState({ route }, '', '#' + route);
  }
  const app = document.getElementById('app-root');
  app.innerHTML = '<div class="flex flex-col items-center justify-center min-h-96 gap-4"><div class="w-10 h-10 rounded-full border-2 border-t-transparent animate-spin" style="border-color:var(--color-primary);border-top-color:transparent;"></div></div>';
  setTimeout(() => {
    routeMatch(route)();
    updateActiveNav();
    Analytics.pageView(route);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, 80);
}

window.addEventListener('popstate', (e) => {
  const route = location.hash.replace('#', '') || '/';
  navigate(route, false);
});

function setSEO({ title, description, canonical, robots, jsonLd, image, type='website' }) {
  document.getElementById('page-title').textContent = title || SITE.name;
  document.getElementById('meta-description').content = description || SITE.description;
  document.getElementById('canonical').href = canonical || SITE.url + currentRoute;
  document.getElementById('meta-robots').content = robots || 'index, follow';
  // OG
  document.getElementById('og-title').content = title || SITE.name;
  document.getElementById('og-description').content = description || SITE.description;
  document.getElementById('og-url').content = canonical || SITE.url + currentRoute;
  document.getElementById('og-image').content = image || `https://placehold.co/1200x630/0f172a/6366f1?text=${encodeURIComponent(SITE.name)}`;
  // Twitter
  document.getElementById('tw-title').content = title || SITE.name;
  document.getElementById('tw-description').content = description || SITE.description;
  document.getElementById('tw-image').content = image || `https://placehold.co/1200x630/0f172a/6366f1?text=${encodeURIComponent(SITE.name)}`;
  // JSON-LD (page-specific)
  let existing = document.getElementById('jsonld-page');
  if (existing) existing.remove();
  if (jsonLd) {
    const s = document.createElement('script');
    s.type = 'application/ld+json';
    s.id = 'jsonld-page';
    s.textContent = JSON.stringify(jsonLd);
    document.head.appendChild(s);
  }
}

function breadcrumbsLD(items) {
  return {
    '@context':'https://schema.org',
    '@type':'BreadcrumbList',
    itemListElement: items.map((item, i) => ({
      '@type':'ListItem',
      position: i+1,

      item: SITE.url + item.path,

  };
}

function breadcrumbsHTML(items) {
  return `<nav aria-label="Breadcrumb" class="flex items-center gap-1 text-sm text-muted mb-6">

      name:vid.title, description:vid.description,

  app.innerHTML = `
  <div class="page-enter max-w-4xl mx-auto px-4 sm:px-6 py-10">
    <h1 class="font-heading font-extrabold text-3xl mb-6">Search Results</h1>
    <form onsubmit="handleSearchForm(event)" class="mb-8">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-muted"></i>
        <input id="page-search" value="${escapeHtml(q)}" class="search-input text-base py-3 pl-12" placeholder="Search…" />
      </div>
    </form>
    ${q ? `<p class="text-muted mb-6">${results.length} result${results.length!==1?'s':''} for "<strong class="text-white">${escapeHtml(q)}</strong>"</p>` : ''}
    <div class="space-y-4">
      ${results.length ? results.map(r=>`
        <div class="glass rounded-xl border p-5 card-hover" style="border-color:var(--color-border);" onclick="navigate('${r.route}')">
          <div class="flex items-center gap-2 mb-1">
            <span class="badge ${r.typeBadge} text-xs">${r.type}</span>
          </div>
          <h3 class="font-heading font-bold">${highlight(r.title, q)}</h3>
          <p class="text-muted text-sm mt-1">${highlight(r.excerpt, q)}</p>
        </div>`).join('')
      : q ? emptyState('fa-magnifying-glass','No results found','Try different keywords or browse categories.') : ''}
    </div>
    ${renderFooter()}
  </div>`;
  window.handleSearchForm = (e) => {
    e.preventDefault();
    const val = document.getElementById('page-search')?.value?.trim();
    if (val) navigate('/search?q='+encodeURIComponent(val));
  };
}

/* ==============================================================
   11. SEARCH ENGINE
   ============================================================== */
function globalSearch(q) {
  const lq = q.toLowerCase();
  const results = [];
  DB.items.forEach(i => {
    if ((i.name+' '+i.tagline+' '+i.shortDescription).toLowerCase().includes(lq))
      results.push({ type:'App', typeBadge:'badge-primary', title:i.name, excerpt:i.tagline, route:`/explore/${i.slug}` });
  });
  DB.articles.forEach(a => {
    if ((a.title+' '+a.excerpt).toLowerCase().includes(lq))
      results.push({ type:'Article', typeBadge:'badge-secondary', title:a.title, excerpt:a.excerpt, route:`/blog/${a.slug}` });
  });
  DB.videos.forEach(v => {
    if ((v.title+' '+v.description).toLowerCase().includes(lq))
      results.push({ type:'Video', typeBadge:'badge-accent', title:v.title, excerpt:v.description, route:`/videos/${v.slug}` });
  });
  DB.categories.forEach(c => {
    if (c.name.toLowerCase().includes(lq))
      results.push({ type:'Category', typeBadge:'badge-muted', title:c.name, excerpt:`Browse all ${c.name} content`, route:`/category/${c.slug}` });
  });
  return results.slice(0,20);
}

function liveSearch(q) {
  if (!q.trim()) { document.getElementById('search-results').innerHTML=''; return; }
  Analytics.search(q);
  const results = globalSearch(q);
  const container = document.getElementById('search-results');
  container.innerHTML = results.length
    ? results.map(r=>`
      <div class="flex gap-3 items-start p-3 rounded-lg hover:bg-surface-alt cursor-pointer transition-colors" onclick="closeSearch();navigate('${r.route}')" style="">
        <span class="badge ${r.typeBadge} text-xs mt-0.5 shrink-0">${r.type}</span>
        <div>
          <p class="font-semibold text-sm">${highlight(r.title,q)}</p>
          <p class="text-muted text-xs">${highlight(r.excerpt.substring(0,80),q)}…</p>
        </div>
      </div>`).join('')
    : `<div class="text-center py-8 text-muted text-sm">${t('noResults')}</div>`;
}

function highlight(text, q) {
  if (!q) return escapeHtml(text);
  return escapeHtml(text).replace(new RegExp(`(${escapeRegex(q)})`, 'gi'), '<mark class="bg-primary/30 text-white rounded px-0.5">$1</mark>');
}

function handleNewsletter(e) {
  e.preventDefault();
  const email = e.target.email.value.trim();
  if (DB.newsletter_subscribers.find(s=>s.email===email)) {
    showToast('You are already subscribed!', 'info'); return;
  }
  DB.newsletter_subscribers.push({ email, date:new Date().toISOString().split('T')[0] });
  Analytics.newsletterSignup();
  showToast('🎉 Successfully subscribed!', 'success');
  e.target.reset();
}

function handleContact(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  DB.contact_messages.push({
    name: fd.get('name'), email: fd.get('email'),
    subject: fd.get('subject'), message: fd.get('message'),
    date: new Date().toISOString().split('T')[0]
  });
  Analytics.contactSubmit();
  showToast('Message sent! We\'ll be in touch soon.', 'success');
  e.target.reset();
}

/* ==============================================================
   13. NAV RENDERING
   ============================================================== */
function renderNavs() {
  const activeLinks = NAV_LINKS.filter(l => !l.feature || FEATURES[l.feature]);

  // Desktop nav
  const dNav = document.getElementById('desktop-nav');
  if (dNav) dNav.innerHTML = activeLinks.map(l=>`
    <a onclick="navigate('${l.route}')" data-route="${l.route}"
       class="nav-link px-3.5 py-2 rounded-lg text-sm font-medium transition-colors text-muted hover:text-white hover:bg-surface-alt cursor-pointer">
      ${l.label}
    </a>`).join('') + (FEATURES.admin ? `<a onclick="navigate('/admin')" class="nav-link px-3.5 py-2 rounded-lg text-sm font-medium transition-colors text-muted hover:text-white hover:bg-surface-alt cursor-pointer ml-2">Admin</a>` : '');

  // Mobile nav
  const mNav = document.getElementById('mobile-nav-links');
  if (mNav) mNav.innerHTML = activeLinks.map(l=>`
    <a onclick="navigate('${l.route}');closeMobileMenu();" data-route="${l.route}"
       class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-base font-medium transition-colors text-muted hover:text-white hover:bg-surface cursor-pointer">
      <i class="fa-solid ${l.icon} w-5"></i>${l.label}
    </a>`).join('') + (FEATURES.admin ? `<a onclick="navigate('/admin');closeMobileMenu();" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-base font-medium text-muted hover:text-white hover:bg-surface cursor-pointer"><i class="fa-solid fa-lock w-5"></i>Admin</a>` : '');

  // Bottom nav
  if (FEATURES.bottomNav) {
    const bNav = document.getElementById('bottom-nav-items');
    const bottomLinks = activeLinks.filter(l=>l.bottomNav);
    if (bNav) bNav.innerHTML = bottomLinks.map(l=>`
      <button onclick="navigate('${l.route}')" data-route="${l.route}" class="bottom-nav-item ${currentRoute===l.route?'active':''}">
        <i class="fa-solid ${l.icon}"></i>
        <span>${l.label}</span>
      </button>`).join('');
  } else {
    document.getElementById('bottom-nav')?.style && (document.getElementById('bottom-nav').style.display='none');
  }

  // Branding
  ['logo-mark','mobile-logo-mark'].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=SITE.logoMark; });
  ['nav-site-name','mobile-site-name'].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=SITE.name; });
  ['header-cta','mobile-cta'].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=SITE.headerCTA.label; });
  if (!FEATURES.announcements) document.getElementById('announcement-bar')?.style && (document.getElementById('announcement-bar').style.display='none');
}

function updateActiveNav() {
  document.querySelectorAll('.nav-link, .bottom-nav-item').forEach(el => {
    const route = el.getAttribute('data-route') || el.getAttribute('onclick')?.match(/navigate\('([^']+)'\)/)?.[1];
    const isActive = route === currentRoute || (currentRoute.startsWith(route) && route !== '/');
    el.classList.toggle('nav-active', isActive);
    if (el.classList.contains('bottom-nav-item')) el.classList.toggle('active', isActive);
  });
}

function toggleMobileMenu() {
  document.getElementById('mobile-menu').classList.toggle('open');
}
function closeMobileMenu() {
  document.getElementById('mobile-menu').classList.remove('open');
}

/* ==============================================================
   14. SEARCH MODAL
   ============================================================== */
function openSearch() {
  document.getElementById('search-modal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('search-input')?.focus(), 100);
}
function closeSearch() {
  document.getElementById('search-modal').classList.add('hidden');
}
function closeSearchOnBackdrop(e) {
  if (e.target.id==='search-modal') closeSearch();
}
function handleSearchKey(e) {
  if (e.key==='Escape') closeSearch();
  if (e.key==='Enter') {
    const q = document.getElementById('search-input')?.value?.trim();
    if (q) { closeSearch(); navigate('/search?q='+encodeURIComponent(q)); }
  }
}
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key==='k') { e.preventDefault(); openSearch(); }
  if (e.key==='Escape') closeSearch();
});

/* ==============================================================
   15. UI HELPERS
   ============================================================== */
function showToast(msg, type='info') {
  const colors = { success:'#22c55e', error:'#ef4444', info:SITE.primaryColor };
  const toast = document.createElement('div');
  toast.className = 'px-5 py-3 rounded-xl text-white text-sm font-semibold shadow-lg mb-2 transition-all pointer-events-auto';
  toast.style.cssText = `background:${colors[type]||colors.info};max-width:320px;opacity:0;transform:translateY(10px);`;
  toast.textContent = msg;
  document.getElementById('toast-container').appendChild(toast);
  requestAnimationFrame(()=>{ toast.style.opacity='1'; toast.style.transform='translateY(0)'; });
  setTimeout(()=>{ toast.style.opacity='0'; setTimeout(()=>toast.remove(), 300); }, 3500);
}

function toggleFaq(i) {
  const ans = document.getElementById('faq-ans-'+i);
  const icon = document.querySelector('.faq-icon-'+i);
  if (!ans) return;
  ans.classList.toggle('open');
  icon?.style && (icon.style.transform = ans.classList.contains('open') ? 'rotate(180deg)' : '');
}

function animateStats() {
  document.querySelectorAll('[data-target]').forEach(el => {
    const target = parseFloat(el.dataset.target);
    const suffix = el.dataset.suffix || '';
    const duration = 1200;
    const start = performance.now();
    const update = (now) => {
      const progress = Math.min((now - start) / duration, 1);
      const ease = 1 - Math.pow(1 - progress, 3);
      const val = target * ease;
      el.textContent = (val >= 10 ? Math.round(val) : val.toFixed(1)) + suffix;
      if (progress < 1) requestAnimationFrame(update);
    };
    const obs = new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) { requestAnimationFrame(update); obs.disconnect(); }
    }, { threshold: 0.3 });
    obs.observe(el);
  });
}

function setupIntersectionPlayback() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const vid = entry.target.querySelector('video');
      if (!vid) return;
      if (entry.isIntersecting) vid.play().catch(()=>{});
      else { vid.pause(); }
    });
  }, { threshold: 0.7 });
  document.querySelectorAll('.reel-item').forEach(el => obs.observe(el));
}

function togglePlay(vidId) {
  const vid = document.getElementById('video-'+vidId);
  const icon = document.getElementById('play-icon-'+vidId);
  if (!vid) return;
  if (vid.paused) { vid.play(); icon.style.opacity='0'; }
  else { vid.pause(); icon.style.opacity='1'; }
}

function toggleMute(vidId) {
  const vid = document.getElementById('video-'+vidId);
  const btn = document.getElementById('mute-btn-'+vidId);
  if (!vid) return;
  vid.muted = !vid.muted;
  btn.innerHTML = vid.muted
    ? '<i class="fa-solid fa-volume-xmark text-white text-sm"></i>'
    : '<i class="fa-solid fa-volume-high text-white text-sm"></i>';
}

/* ==============================================================
   16. UTILS
   ============================================================== */
function getCategoryName(id) {
  return DB.categories.find(c=>c.id===id)?.name || 'Uncategorized';
}
function formatDate(str) {
  if (!str) return '';
  try { return new Date(str).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }
  catch(e) { return str; }
}
function slugify(str) {
  return str.toLowerCase().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').trim();
}
function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escapeRegex(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
}

   17. BOOT
   ============================================================== */
document.addEventListener('DOMContentLoaded', () => {
  // Apply theme tokens from SITE config
  document.documentElement.style.setProperty('--color-primary',      SITE.primaryColor);
  document.documentElement.style.setProperty('--color-secondary',    SITE.secondaryColor);
  document.documentElement.style.setProperty('--color-accent',       SITE.accentColor);
  document.documentElement.style.setProperty('--color-bg',           SITE.bgColor);

  // Render navs
  renderNavs();

  // Determine initial route
  const initRoute = location.hash.replace('#','') || '/';
  navigate(initRoute, false);
});
